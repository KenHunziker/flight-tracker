name: 5-Minute Flight Tracker

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs automatically every 5 minutes
  workflow_dispatch:      # Gives you a manual "Run" button in GitHub

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Restore State File
        uses: actions/cache@v4
        with:
          path: flight_state.json
          key: flight-state-${{ github.run_id }}
          restore-keys: |
            flight-state-

      - name: Install Dependencies
        run: pip install requests reverse-geocode

      - name: Run Script
        run: python tracker.py

      - name: Save State File
        if: always()
        uses: actions/cache/save@v4
        with:
          path: flight_state.json
          key: flight-state-${{ github.run_id }}
